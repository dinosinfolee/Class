const PAGES = [{"name": "프론트엔드·백엔드", "html": "<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>웹 브라우저 구조<\/title>\n<style>\n  :root{\n    --ink:#1f2937; --muted:#6b7280; --line:#e5e7eb;\n    --fe:#2563eb; --fe-bg:#eff5ff;\n    --be:#059669; --be-bg:#ecfdf5;\n    --net:#d97706; --net-bg:#fffbeb;\n    --res:#7c3aed;\n    --mono:ui-monospace,Menlo,Consolas,monospace;\n  }\n  *{box-sizing:border-box;margin:0;padding:0}\n  html,body{width:100%;height:100%;overflow:hidden;background:#fff}\n  @media (prefers-color-scheme: dark){ html,body{background:#191919} }\n  body{font-family:\"Pretendard\",\"Apple SD Gothic Neo\",\"Malgun Gothic\",\"Noto Sans KR\",system-ui,sans-serif;color:var(--ink)}\n  #stage{position:absolute;left:0;top:0;width:760px;height:584px;transform-origin:0 0;background:#fff;border-radius:18px;overflow:hidden}\n  .abs{position:absolute}\n\n  /* 머리글 */\n  .title{left:14px;top:12px;font-size:20px;font-weight:800;letter-spacing:-.6px}\n  .controls{left:0;right:0;top:542px;display:flex;justify-content:center;gap:8px}\n  .controls button{font:inherit;font-size:14px;font-weight:700;padding:7px 16px;border-radius:7px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}\n  .controls button:hover:not(:disabled){background:#f3f4f6}\n  .controls button:disabled{opacity:.35;cursor:default}\n  .controls .primary{background:var(--ink);color:#fff;border-color:var(--ink)}\n  .controls .primary:hover{background:#374151 !important}\n\n  /* 영역 */\n  .zone{top:52px;height:254px;border-radius:12px;padding:7px 10px}\n  .zone h3{font-size:15px;font-weight:800;letter-spacing:-.3px;line-height:1.25}\n  .zone h3 span{font-size:12px;font-weight:700;opacity:.75;margin-left:4px}\n  .zone p{font-size:12px;color:#4b5563;margin-top:1px}\n  #feZone{left:12px;width:340px;background:var(--fe-bg)} #feZone h3{color:var(--fe)}\n  #netZone{left:358px;width:84px;backgro nt-family:inherit}\n  #likeBtn:hover{border-color:#f43f5e}\n  #likeBtn.idle{animation:ring 1.6s ease-out infinite}\n  @keyframes ring{0%{box-shadow:0 0 0 0 rgba(244,63,94,.45)}100%{box-shadow:0 0 0 9px rgba(244,63,94,0)}}\n  #likeBtn.on{color:#e11d48;border-color:#fecdd3;background:#fff1f2}\n  #likeBtn.press{transform:scale(.82)}\n  #likeBtn.pop{animation:pop .45s ease}\n  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.3)}100%{transform:scale(1)}}\n  #likeCount{font-size:14px;font-weight:800}\n\n  .engines{height:68px;border-top:1.5px dashed #94a3b8;background:#f8fafc;position:relative}\n  .engines .lab{position:absolute;left:8px;top:3px;font-size:12px;font-weight:700;color:#475569}\n  .eng{position:absolute;top:20px;width:98px;height:42px;background:#fff;border:1px solid #cbd5e1;border-radius:7px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:12.5px;font-weight:800;line-height:1.2;color:var(--fe);transition:box-shadow .3s,background .3s,border-color .3s}\n\n  /* 서버·DB */\n  .box{left:458px;width:280px;background:#fff;border:1px solid #a7f3d0;border-radius:9px;padding:8px;transition:box-shadow .3s,background .3s}\n  #server{top:98px;height:104px}\n  #db{top:208px;height:90px}\n  .boxHead{display:flex;align-items:center;gap:7px;height:24px}\n  .ico{width:24px;height:24px;border-radius:6px;background:var(--be);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex:none}\n  .boxHead b{font-size:14px;font-weight:800;color:#065f46}\n  .boxHead span{font-size:12px;color:var(--muted);margin-left:2px}\n  #console{margin-top:6px;height:58px;background:#0f172a;border-radius:6px;padding:4px 8px;font-family:var(--mono);font-size:12px;line-height:1.4;color:#cbd5e1;white-space:pre;overflow:hidden}\n  #console .ok{color:#4ade80} #console .go{color:#fbbf24}\n  table{margin-top:6px;width:100%;border-collapse:collapse;font-size:12.5px}\n  th,td{border:1px solid #d1fae5;padding:2px 7px;text-align:left;height:21px}\n  th{background:#f0fdf4;color:#065f46;font-weight:700}\n  td.num{font-weight:800;font-family:var(--mono);transition:background .4s}\n  td.flash{background:#fef08a}\n\n  /* 강조 */\n  .hl{box-shadow:0 0 0 3px var(--c),0 5px 14px rgba(0,0,0,.12) !important}\n  .viewport.hl{box-shadow:inset 0 0 0 3px var(--c) !important;background:#f8fbff}\n  .eng.hl{background:#eff6ff;border-color:var(--c)}\n  .box.hl{background:#f6fffb}\n\n  /* 통신 경로 */\n  #lanes{position:absolute;left:0;top:0;pointer-events:none}\n  #lanes path.lane{fill:none;stroke-width:2.5;stroke-dasharray:5 5;opacity:.45;transition:opacity .3s,stroke-width .3s}\n  #lanes path.lane.on{opacity:1;stroke-width:3.5;animation:dash .6s linear infinite}\n  @keyframes dash{to{stroke-dashoffset:-10}}\n  .packet{position:absolute;left:0;top:0;offset-anchor:50% 50%;offset-rotate:0deg;font-size:12px;font-weight:800;color:#fff;padding:3px 8px;border-radius:12px;white-space:nowrap;opacity:0;pointer-events:none;box-shadow:0 3px 8px rgba(0,0,0,.2)}\n  #pReq{background:var(--net);offset-path:path('M 332 262 C 400 262, 400 140, 458 140')}\n  #pRes{background:var(--res);offset-path:path('M 458 172 C 410 172, 400 282, 332 282')}\n  .packet.go{opacity:1;animation:travel 1.5s ease-in-out forwards}\n  @keyframes travel{from{offset-distance:0%}to{offset-distance:100%}}\n\n  /* 하단 설명 */\n  #panel{left:12px;top:314px;width:736px;height:218px;border:1px solid var(--line);border-radius:12px;background:#fff}\n  #stepper{position:absolute;left:10px;top:9px;right:10px;display:flex;gap:4px}\n  .st{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;height:26px;border-radius:13px;cursor:pointer;font-size:12px;font-weight:700;color:#9ca3af;background:#f9fafb;white-space:nowrap}\n  .st .n{width:17px;height:17px;border-radius:50%;border:1.5px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex:none}\n  .st.done{color:#4b5563}\n  .st.done .n{border-color:var(--c);color:var(--c)}\n  .st.cur{color:#fff;background:var(--c)}\n  .st.cur .n{border-color:#fff;color:#fff}\n  #explain{position:absolute;left:14px;top:46px;width:404px}\n  .head{display:flex;align-items:center;gap:8px}\n  #area{font-size:12px;font-weight:800;color:#fff;padding:1px 7px;border-radius:4px;line-height:18px}\n  #stTitle{font-size:18px;font-weight:800;letter-spacing:-.4px}\n  #stDesc{font-size:16px;line-height:1.65;color:#374151;margin-top:6px;word-break:keep-all}\n  #code{position:absolute;left:428px;top:46px;width:296px;height:162px;background:#0f172a;border-radius:8px;padding:6px 11px;font-family:var(--mono);font-size:13px;line-height:1.55;color:#e2e8f0;white-space:pre;overflow:hidden}\n  #code .cm{color:#7dd3a8}\n<\/style>\n<style>html,body{background:transparent!important}#stage{border-radius:0!important}<\/style><\/head>\n<body>\n<div id=\"stage\">\n\n  <div class=\"abs title\">좋아요 버튼을 누르면 무슨 일이 일어날까?<\/div>\n  <div class=\"abs controls\">\n    <button id=\"bReset\">↺ 초기화<\/button>\n    <button id=\"bPrev\">◀ 이전<\/button>\n    <button id=\"bNext\">다음 ▶<\/button>\n    <button id=\"bPlay\" class=\"primary\">▶ 자동 재생<\/button>\n  <\/div>\n\n  <!-- 영역 -->\n  <div class=\"abs zone\" id=\"feZone\">\n    <h3>프론트엔드<span>Front-end<\/span><\/h3>\n    <p>사용자가 보고 조작하는 부분 · 브라우저에서 실행<\/p>\n  <\/div>\n  <div class=\"abs zone\" id=\"netZone\">\n    <h3>인터넷<\/h3>\n    <p>통신 경로<\/p>\n  <\/div>\n  <div class=\"abs zone\" id=\"beZone\">\n    <h3>백엔드<span>Back-end<\/span><\/h3>\n    <p>데이터를 처리·저장하는 부분 · 서버에서 실행<\/p>\n  <\/div>\n\n  <!-- 통신 경로 -->\n  <svg id=\"lanes\" width=\"760\" height=\"492\" viewBox=\"0 0 760 492\">\n    <defs>\n      <marker id=\"mReq\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#d97706\"/><\/marker>\n      <marker id=\"mRes\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#7c3aed\"/><\/marker>\n    <\/defs>\n    <path class=\"lane\" data-hl=\"laneReq\" d=\"M 332 262 C 400 262, 400 140, 458 140\" stroke=\"#d97706\" marker-end=\"url(#mReq)\"/>\n    <path class=\"lane\" data-hl=\"laneRes\" d=\"M 458 172 C 410 172, 400 282, 332 282\" stroke=\"#7c3aed\" marker-end=\"url(#mRes)\"/>\n  <\/svg>\n\n  <!-- 웹 브라우저 -->\n  <div class=\"abs\" id=\"frame\">\n    <div class=\"tabs\">\n      <div class=\"dots\"><i style=\"background:#f87171\"><\/i><i style=\"background:#fbbf24\"><\/i><i style=\"background:#4ade80\"><\/i><\/div>\n      <div class=\"tab\">SNS 게시물<\/div>\n      <span class=\"tag\" style=\"right:6px;top:2px;background:#475569\">사용자 인터페이스<\/span>\n    <\/div>\n    <div class=\"toolbar\">\n      <span class=\"nav\">←→↻<\/span>\n      <div class=\"url\">sns.example.com/post/42<\/div>\n    <\/div>\n    <div class=\"viewport\" data-hl=\"viewport\" style=\"--c:var(--fe)\">\n      <div class=\"photo\"><\/div>\n      <div class=\"post\">\n        <div class=\"who\"><i><\/i>sejong_ai<\/div>\n        <div class=\"caption\">오늘 첫 웹앱 완성!<\/div>\n        <div class=\"likeRow\">\n          <button id=\"likeBtn\" aria-label=\"좋아요\">♡<\/button>\n          <span id=\"likeCount\">좋아요 127개<\/span>\n        <\/div>\n      <\/div>\n      <span class=\"tag\" style=\"right:6px;top:6px;background:var(--fe)\">웹 페이지 표시 영역<\/span>\n    <\/div>\n    <div class=\"engines\">\n      <div class=\"lab\">브라우저 내부 (보이지 않는 부분)<\/div>\n      <div class=\"eng\" data-hl=\"renderEngine\" style=\"left:8px;--c:var(--fe)\">렌더링<br>엔진<\/div>\n      <div class=\"eng\" data-hl=\"jsEngine\" style=\"left:110px;--c:var(--fe)\">JavaScript<br>엔진<\/div>\n      <div class=\"eng\" data-hl=\"netModule\" style=\"left:212px;--c:var(--net);color:var(--net)\">네트워크<br>모듈<\/div>\n    <\/div>\n  <\/div>\n\n  <!-- 서버 -->\n  <div class=\"abs box\" id=\"server\" data-hl=\"server\" style=\"--c:var(--be)\">\n    <div class=\"boxHead\"><div class=\"ico\">S<\/div><b>웹 서버<\/b><span>요청 처리<\/span><\/div>\n    <div id=\"console\"><\/div>\n  <\/div>\n  <div class=\"abs box\" id=\"db\" data-hl=\"db\" style=\"--c:var(--be)\">\n    <div class=\"boxHead\"><div class=\"ico\">DB<\/div><b>데이터베이스<\/b><span>영구 저장<\/span><\/div>\n    <table>\n      <tr><th>게시물<\/th><th>작성자<\/th><th>좋아요 수<\/th><\/tr>\n      <tr><td><b>42<\/b><\/td><td><b>sejong_ai<\/b><\/td><td class=\"num\" id=\"dbVal\">127<\/td><\/tr>\n    <\/table>\n  <\/div>\n\n  <div class=\"packet\" id=\"pReq\">요청<\/div>\n  <div class=\"packet\" id=\"pRes\">응답 128<\/div>\n\n  <!-- 하단 설명 -->\n  <div class=\"abs\" id=\"panel\">\n    <div id=\"stepper\"><\/div>\n    <div id=\"explain\">\n      <div class=\"head\"><span id=\"area\"><\/span><span id=\"stTitle\"><\/span><\/div>\n      <div id=\"stDesc\"><\/div>\n    <\/div>\n    <div id=\"code\"><\/div>\n  <\/div>\n\n<\/div>\n\n<script>\nconst AREA = {\n  fe:   {name:'프론트엔드', color:'#2563eb'},\n  net:  {name:'네트워크',   color:'#d97706'},\n  be:   {name:'백엔드',     color:'#059669'},\n  intro:{name:'안내',       color:'#1f2937'}\n};\n\nconst steps = [\n  { area:'intro', title:'좋아요 버튼의 동작 과정',\n    desc:'화면 속 ♡ 버튼을 클릭하거나 [다음]을 눌러 시작합니다. 클릭 한 번이 다시 화면에 반영되기까지 7단계를 거칩니다.',\n    code:'<!-- 좋아요 버튼 (HTML) -->\\n<button id=\"like\">♡<\/button>\\n<span id=\"count\">127<\/span>', hl:[] },\n  { area:'fe', title:'클릭 입력',\n    desc:'사용자가 ♡ 버튼을 클릭합니다. 브라우저는 클릭한 위치의 HTML 요소를 찾아 클릭 이벤트를 발생시킵니다.',\n    code:'<!-- 클릭한 요소 (HTML) -->\\n<button id=\"like\">♡<\/button>\\n<span id=\"count\">127<\/span>', hl:['viewport'] },\n  { area:'fe', title:'이벤트 처리',\n    desc:'JavaScript 엔진이 버튼에 연결된 코드를 실행하여 \"42번 게시물에 좋아요 추가\" 요청을 작성합니다.',\n    code:\"// 클릭 시 실행 (JavaScript)\\nlike.onclick = () => {\\n  sendLike(42);\\n};\", hl:['jsEngine'] },\n  { area:'net', title:'요청 전송',\n    desc:'네트워크 모듈이 요청을 HTTP 형식으로 작성하여 인터넷을 통해 서버에 전송합니다.',\n    code:\"// 요청 전송 (JavaScript)\\nfetch('/api/posts/42/like',\\n      { method: 'POST' });\\n// 실제 HTTP 요청\\nPOST /api/posts/42/like\", hl:['netModule','laneReq'], packet:'pReq' },\n  { area:'be', title:'요청 검증',\n    desc:'서버가 요청을 수신하고, 로그인한 사용자인지와 중복 요청인지 검증합니다. 이 과정은 화면에 보이지 않습니다.',\n    code:\"// 서버 코드 (Node.js 예시)\\napp.post('/api/posts/:id/like',\\n  (req, res) => {\\n    if (!req.user) return;\\n    addLike(req.user, 42);\\n  });\", hl:['server'] },\n  { area:'be', title:'데이터 저장',\n    desc:'서버가 데이터베이스의 좋아요 수를 127에서 128로 갱신합니다. 저장된 값은 브라우저를 닫아도 유지됩니다.',\n    code:\"-- 데이터베이스 명령 (SQL)\\nUPDATE posts\\nSET likes = likes + 1\\nWHERE id = 42;  -- 127→128\", hl:['db'] },\n  { area:'net', title:'응답 전송',\n    desc:'서버가 처리 결과와 최신 좋아요 수를 JSON 형식으로 브라우저에 반환합니다. 200은 정상 처리를 의미합니다.',\n    code:'// 서버의 HTTP 응답\\nHTTP/1.1 200 OK\\n\\n{ \"liked\": true,\\n  \"likes\": 128 }', hl:['server','laneRes','netModule'], packet:'pRes' },\n  { area:'fe', title:'화면 갱신',\n    desc:'JavaScript 엔진이 응답에 따라 HTML을 변경하고, 렌더링 엔진이 화면을 다시 그립니다. 좋아요 수가 128로 표시됩니다.',\n    code:\"// 화면 갱신 (JavaScript)\\nconst data = await res.json();\\nlike.textContent = '♥';\\ncount.textContent = data.likes;\", hl:['jsEngine','renderEngine','viewport'] }\n];\nconst LAST = steps.length - 1;\n\nconst consoleText = [\n  '<span class=\"go\">●<\/span> 요청 대기 중…',\n  '<span class=\"go\">●<\/span> 요청 대기 중…',\n  '<span class=\"go\">●<\/span> 요청 대기 중…',\n  '<span class=\"go\">●<\/span> 요청 대기 중…\\n<span class=\"go\">→<\/span> 요청 수신 중',\n  '<span class=\"go\">→<\/span> POST /api/posts/42/like\\n<span class=\"ok\">✓<\/span> 로그인 사용자 확인\\n<span class=\"ok\">✓<\/span> 중복 요청 확인',\n  '<span class=\"ok\">✓<\/span> 검증 완료\\n<span class=\"go\">→<\/span> 데이터베이스 갱신\\n<span class=\"ok\">✓<\/span> 좋아요 수 128 저장',\n  '<span class=\"go\">→<\/span> 응답 전송: 200 OK\\n   likes: 128',\n  '<span class=\"ok\">✓<\/span> 응답 전송 완료\\n<span class=\"go\">●<\/span> 다음 요청 대기 중…'\n];\n\nconst $ = id => document.getElementById(id);\nlet cur = 0, timer = null;\n\nsteps.slice(1).forEach((s, i) => {\n  const el = document.createElement('div');\n  el.className = 'st';\n  el.style.setProperty('--c', AREA[s.area].color);\n  el.innerHTML = `<span class=\"n\">${i+1}<\/span>${s.title}`;\n  el.onclick = () => { stop(); go(i+1); };\n  $('stepper').appendChild(el);\n});\n\nfunction renderCode(text){\n  const box = $('code'); box.innerHTML = '';\n  text.split('\\n').forEach((line, i) => {\n    if (i) box.appendChild(document.createTextNode('\\n'));\n    let idx = line.trim().startsWith('<!--') ? line.indexOf('<!--') : line.indexOf('//');\n    if (idx < 0) idx = line.indexOf('-- ');\n    if (idx < 0) { box.appendChild(document.createTextNode(line)); return; }\n    box.appendChild(document.createTextNode(line.slice(0, idx)));\n    const sp = document.createElement('span'); sp.className = 'cm'; sp.textContent = line.slice(idx);\n    box.appendChild(sp);\n  });\n}\n\nfunction go(n){\n  const prev = cur;\n  cur = Math.max(0, Math.min(LAST, n));\n  const s = steps[cur], a = AREA[s.area];\n\n  document.querySelectorAll('.st').forEach((el, i) => {\n    el.classList.toggle('cur', i+1 === cur);\n    el.classList.toggle('done', i+1 < cur);\n  });\n\n  $('area').textContent = cur ? `${cur}단계 · ${a.name}` : a.name;\n  $('area').style.background = a.color;\n  $('stTitle').textContent = s.title;\n  $('stDesc').textContent = s.desc;\n  renderCode(s.code);\n\n  document.querySelectorAll('[data-hl]').forEach(el => {\n    const on = s.hl.includes(el.dataset.hl);\n    el.classList.toggle(el.tagName === 'path' ? 'on' : 'hl', on);\n  });\n\n  const btn = $('likeBtn');\n  const liked = cur >= 7;\n  btn.textContent = liked ? '♥' : '♡';\n  btn.classList.toggle('on', liked);\n  btn.classList.toggle('idle', cur === 0);\n  $('likeCount').textContent = `좋아요 ${liked ? 128 : 127}개`;\n  btn.classList.remove('press','pop');\n  if (cur === 1) btn.classList.add('press');\n  if (cur === 7 && prev !== 7) { void btn.offsetWidth; btn.classList.add('pop'); }\n\n  const v = $('dbVal');\n  v.textContent = cur >= 5 ? '128' : '127';\n  v.classList.toggle('flash', cur === 5);\n\n  $('console').innerHTML = consoleText[cur];\n\n  ['pReq','pRes'].forEach(id => {\n    const p = $(id); p.classList.remove('go');\n    if (s.packet === id) { void p.offsetWidth; p.classList.add('go'); }\n  });\n\n  $('bPrev').disabled = cur === 0;\n  $('bNext').disabled = cur === LAST;\n}\n\nfunction play(){\n  if (cur === LAST) go(0);\n  $('bPlay').textContent = '❚❚ 일시 정지';\n  go(cur + 1);\n  timer = setInterval(() => { if (cur < LAST) go(cur + 1); if (cur === LAST) stop(); }, 2600);\n}\nfunction stop(){\n  clearInterval(timer); timer = null;\n  $('bPlay').textContent = '▶ 자동 재생';\n}\n\n$('bPlay').onclick = () => timer ? stop() : play();\n$('bNext').onclick = () => { stop(); go(cur + 1); };\n$('bPrev').onclick = () => { stop(); go(cur - 1); };\n$('bReset').onclick = () => { stop(); go(0); };\n$('likeBtn').onclick = () => {\n  if (timer) return;\n  if (cur === 0) play();\n  else if (cur === LAST) go(0);\n};\n\n/* 화면 크기에 맞춰 비율 유지 */\nfunction fit(){\n  const k = Math.min(innerWidth / 760, innerHeight / 584);\n  const st = $('stage');\n  st.style.transform = `scale(${k})`;\n  st.style.left = (innerWidth - 760 * k) / 2 + 'px';\n  st.style.top = (innerHeight - 584 * k) / 2 + 'px';\n}\naddEventListener('resize', fit);\nfit();\ngo(0);\n<\/script>\n<\/body>\n<\/html>\n"}, {"name": "API", "html": "<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>API와 API 키<\/title>\n<style>\n  :root{\n    --ink:#1f2937; --muted:#6b7280; --line:#e5e7eb;\n    --app:#2563eb; --app-bg:#eff5ff;\n    --api:#d97706; --api-bg:#fffbeb;\n    --svc:#059669; --svc-bg:#ecfdf5;\n    --key:#7c3aed; --key-bg:#f5f3ff;\n    --risk:#dc2626;\n    --mono:ui-monospace,Menlo,Consolas,monospace;\n  }\n  *{box-sizing:border-box;margin:0;padding:0}\n  html,body{width:100%;height:100%;overflow:hidden;background:#fff}\n  @media (prefers-color-scheme: dark){ html,body{background:#191919} }\n  body{font-family:\"Pretendard\",\"Apple SD Gothic Neo\",\"Malgun Gothic\",\"Noto Sans KR\",system-ui,sans-serif;color:var(--ink)}\n  #stage{position:absolute;left:0;top:0;width:760px;height:584px;transform-origin:0 0;background:#fff;border-radius:18px;overflow:hidden}\n  .abs{position:absolute}\n\n  .title{left:14px;top:12px;font-size:20px;font-weight:800;letter-spacing:-.6px}\n  .controls{left:0;right:0;top:542px;display:flex;justify-content:center;gap:8px}\n  .controls button{font:inherit;font-size:14px;font-weight:700;padding:7px 16px;border-radius:7px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}\n  .controls button:hover:not(:disabled){background:#f3f4f6}\n  .controls button:disabled{opacity:.35;cursor:default}\n  .controls .primary{background:var(--ink);color:#fff;border-color:var(--ink)}\n  .controls .primary:hover{background:#374151 !important}\n\n  /* 영역 */\n  .zone{top:52px;height:254px;border-radius:12px;padding:7px 10px}\n  .zone h3{font-size:15px;font-weight:800;letter-spacing:-.3px;line-height:1.25}\n  .zone h3 span{font-size:12px;font-weight:700;opacity:.75;margin-left:4px}\n  .zone p{font-size:12px;color:#4b5563;margin-top:1px;white-space:nowrap}\n  #zKey{left:12px;width:236px;background:var(--key-bg)} #zKey h3{color:var(--key)}\n  #zApp{left:254px;width:140px;background:var(--app-bg)} #zApp h3{color:var(--app)}\n  #zApi{left:400px;width:130px;background:var(--api-bg)} #zApi h3{color:var(--api)}\n  #zSvc{left:536px;width:212px;background:var(--svc-bg)} #zSvc h3{color:var(--svc)}\n\n  /* 신용카드 */\n  #card{left:24px;top:98px;width:212px;height:118px;border-radius:11px;background:linear-gradient(135deg,#1e3a8a,#4338ca 60%,#7c3aed);color:#fff;padding:12px 14px;box-shadow:0 4px 12px rgba(30,58,138,.25);transition:box-shadow .3s}\n  .chip{width:30px;height:22px;border-radius:5px;background:linear-gradient(135deg,#fde68a,#d97706)}\n  .brand{position:absolute;right:14px;top:12px;font-size:12px;font-weight:800;letter-spacing:1px;opacity:.85}\n  .fl{font-size:12px;opacity:.75;font-weight:600}\n  .fv{font-family:var(--mono);font-weight:700}\n  .field{border-radius:5px;padding:1px 4px;margin:0 -4px;transition:background .3s}\n  #card.hl .field{background:rgba(255,255,255,.2)}\n  #fNum{display:block;margin-top:10px;font-size:15px;letter-spacing:.5px}\n  .row{display:flex;gap:16px;margin-top:8px;align-items:baseline}\n  .row .fv{font-size:13px;margin-left:4px}\n  .merge{left:24px;top:220px;width:212px;text-align:center;font-size:12px;font-weight:700;color:var(--key)}\n  #keyBox{left:24px;top:240px;width:212px;height:34px;background:#fff;border:1.5px solid #c4b5fd;border-radius:8px;display:flex;align-items:center;gap:7px;padding:0 8px;transition:box-shadow .3s}\n  .pill{font-size:12px;font-weight:800;color:#fff;background:var(--key);border-radius:4px;padding:0 6px;line-height:18px;flex:none}\n  #keyText{font-family:var(--mono);font-size:13px;font-weight:700;color:#4c1d95}\n  #keyText.old{text-decoration:line-through;color:#9ca3af}\n  .note{left:24px;top:280px;width:212px;text-align:center;font-size:12px;color:#4b5563}\n\n  /* 내 웹앱 */\n  .box{background:#fff;border:1px solid #cbd5e1;border-radius:9px;padding:8px;transition:box-shadow .3s,background .3s,opacity .3s}\n  #app{left:264px;top:98px;width:120px;height:104px}\n  .appT{font-size:13px;font-weight:800;color:var(--app)}\n  .inp{margin-top:6px;height:22px;border:1px solid #cbd5e1;border-radius:5px;font-size:12px;padding:0 6px;display:flex;align-items:center}\n  .btnRow{display:flex;align-items:center;gap:6px;margin-top:6px}\n  #trBtn{font-size:12px;font-weight:800;color:#fff;background:var(--app);border-radius:5px;padding:2px 9px;transition:transform .2s}\n  #trBtn.press{transform:scale(.85)}\n  #result{font-size:13px;font-weight:800;color:var(--svc);opacity:0;transition:opacity .4s}\n  #other{left:264px;top:212px;width:120px;height:86px;opacity:.35;border-style:dashed}\n  #other.show{opacity:1}\n  .who{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:800}\n  .who i{width:20px;height:20px;border-radius:50%;background:#9ca3af;color:#fff;font-style:normal;font-size:12px;display:flex;align-items:center;justify-content:center}\n  #otherMsg{font-size:12px;color:#4b5563;margin-top:6px;line-height:1.4}\n\n  /* API 창구 */\n  #gate{left:410px;top:98px;width:110px;height:200px;border-color:#fcd34d;line-height:1.3}\n  .gT{font-size:13px;font-weight:800;color:var(--api)}\n  .rule{margin-top:4px}\n  .rule .fl{opacity:1;color:var(--muted);display:block}\n  .rule .v{font-family:var(--mono);font-size:12px;font-weight:700}\n  #check{margin-top:7px;border-radius:6px;background:#f9fafb;border:1px solid var(--line);padding:4px 6px;text-align:center}\n  #check .fl{opacity:1;color:var(--muted);display:block}\n  #checkV{font-size:13px;font-weight:800}\n\n  /* 서비스 */\n  #server{left:546px;top:98px;width:192px;height:104px;border-color:#a7f3d0}\n  #bill{left:546px;top:212px;width:192px;height:86px;border-color:#a7f3d0}\n  .bh{display:flex;align-items:center;gap:6px;height:22px}\n  .ico{width:22px;height:22px;border-radius:6px;background:var(--svc);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex:none}\n  .bh b{font-size:14px;font-weight:800;color:#065f46;white-space:nowrap}\n  #console{margin-top:6px;height:60px;background:#0f172a;border-radius:6px;padding:4px 8px;font-family:var(--mono);font-size:12px;line-height:1.4;color:#cbd5e1;white-space:pre;overflow:hidden}\n  #console .ok{color:#4ade80} #console .go{color:#fbbf24} #console .no{color:#f87171}\n  .billRow{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px;font-size:12px;color:#4b5563}\n  #amount{font-size:19px;font-weight:800;font-family:var(--mono);transition:color .3s}\n  #amount.warn{color:var(--risk)}\n  #billMsg{font-size:12px;font-weight:700;margin-top:3px;min-height:16px}\n\n  /* 강조 */\n  .hl{box-shadow:0 0 0 3px var(--c),0 5px 14px rgba(0,0,0,.12) !important}\n\n  /* 경로 */\n  #lanes{position:absolute;left:0;top:0;pointer-events:none}\n  #lanes path{fill:none;stroke-width:2.5;stroke-dasharray:5 5;opacity:.4;transition:opacity .3s,stroke-width .3s}\n  #lanes path.on{opacity:1;stroke-width:3.5;animation:dash .6s linear infinite}\n  @keyframes dash{to{stroke-dashoffset:-10}}\n  .packet{position:absolute;left:0;top:0;offset-anchor:50% 50%;offset-rotate:0deg;font-size:12px;font-weight:800;color:#fff;padding:3px 8px;border-radius:12px;white-space:nowrap;opacity:0;pointer-events:none;box-shadow:0 3px 8px rgba(0,0,0,.2)}\n  #pReq{background:var(--api);offset-path:path('M 384 132 L 546 132')}\n  #pRes{background:var(--svc);offset-path:path('M 546 176 L 384 176')}\n  #pOther{background:var(--risk);offset-path:path('M 384 255 C 470 255, 470 150, 546 150')}\n  .packet.go{opacity:1;animation:travel 1.6s ease-in-out forwards}\n  @keyframes travel{from{offset-distance:0%}to{offset-distance:100%}}\n\n  /* 하단 설명 */\n  #panel{left:12px;top:314px;width:736px;height:218px;border:1px solid var(--line);border-radius:12px;background:#fff}\n  #stepper{position:absolute;left:10px;top:9px;right:10px;display:flex;gap:4px}\n  .st{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;height:26px;border-radius:13px;cursor:pointer;font-size:12px;font-weight:700;color:#9ca3af;background:#f9fafb;white-space:nowrap}\n  .st .n{width:17px;height:17px;border-radius:50%;border:1.5px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex:none}\n  .st.done{color:#4b5563}\n  .st.done .n{border-color:var(--c);color:var(--c)}\n  .st.cur{color:#fff;background:var(--c)}\n  .st.cur .n{border-color:#fff;color:#fff}\n  #explain{position:absolute;left:14px;top:46px;width:404px}\n  .head{display:flex;align-items:center;gap:8px}\n  #area{font-size:12px;font-weight:800;color:#fff;padding:1px 7px;border-radius:4px;line-height:18px}\n  #stTitle{font-size:18px;font-weight:800;letter-spacing:-.4px}\n  #stDesc{font-size:16px;line-height:1.65;color:#374151;margin-top:6px;word-break:keep-all}\n  #code{position:absolute;left:428px;top:46px;width:296px;height:162px;background:#0f172a;border-radius:8px;padding:7px 11px;font-family:var(--mono);font-size:13px;line-height:1.55;color:#e2e8f0;white-space:pre;overflow:hidden}\n  #code .cm{color:#7dd3a8}\n\n  /* 요청 방식 안내 */\n  .info{display:inline-flex;align-items:center;justify-content:center;width:13px;height:13px;margin-left:4px;border-radius:50%;border:1.2px solid var(--api);background:#fff;color:var(--api);font:800 9.5px/1 Georgia,serif;font-style:italic;cursor:pointer;vertical-align:1px;padding:0}\n  .info:hover{background:var(--api);color:#fff}\n  #modal{position:absolute;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:rgba(15,23,42,.28);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);opacity:0;pointer-events:none;transition:opacity .25s}\n  #modal.open{opacity:1;pointer-events:auto}\n  .mbox{width:540px;background:#fff;border-radius:14px;padding:18px 20px 16px;box-shadow:0 18px 40px rgba(0,0,0,.25);transform:translateY(8px);transition:transform .25s}\n  #modal.open .mbox{transform:none}\n  .mhead{display:flex;align-items:center;justify-content:space-between}\n  .mhead b{font-size:18px;font-weight:800;letter-spacing:-.4px}\n  .mx{width:28px;height:28px;border-radius:50%;border:none;background:#f3f4f6;font-size:16px;cursor:pointer;color:#374151}\n  .mx:hover{background:#e5e7eb}\n  .mdesc{word-break:keep-all;font-size:14px;color:#374151;margin-top:6px;line-height:1.55}\n  .mt{width:100%;border-collapse:collapse;margin-top:12px;font-size:13.5px}\n  .mt th{background:#f9fafb;color:#4b5563;font-weight:700;text-align:left;padding:7px 10px;border-bottom:1px solid var(--line)}\n  .mt td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}\n  .mt td:first-child{width:96px}\n  .mth{display:inline-block;font-family:var(--mono);font-size:12.5px;font-weight:800;color:#fff;border-radius:5px;padding:2px 7px}\n  .mt tr.cur td{background:#fffbeb}\n  .mnote{word-break:keep-all;margin-top:12px;font-size:13.5px;line-height:1.55;background:#fffbeb;border-radius:8px;padding:9px 12px;color:#78350f}\n<\/style>\n<style>html,body{background:transparent!important}#stage{border-radius:0!important}<\/style><\/head>\n<body>\n<div id=\"stage\">\n\n  <div class=\"abs title\">API는 어떻게 동작할까?<\/div>\n\n  <!-- 영역 -->\n  <div class=\"abs zone\" id=\"zKey\"><h3>API 키<span>API Key<\/span><\/h3><p>신용카드 정보와 같은 역할<\/p><\/div>\n  <div class=\"abs zone\" id=\"zApp\"><h3>클라이언트<span>Client<\/span><\/h3><p>예: 내 웹앱<\/p><\/div>\n  <div class=\"abs zone\" id=\"zApi\"><h3>API<\/h3><p>정해진 요청 창구<\/p><\/div>\n  <div class=\"abs zone\" id=\"zSvc\"><h3>서버<span>Server<\/span><\/h3><p>예: 제미나이, 클로드, GPT<\/p><\/div>\n\n  <!-- 신용카드와 API 키 -->\n  <div class=\"abs\" id=\"card\" data-hl=\"card\" style=\"--c:var(--key)\">\n    <div class=\"chip\"><\/div>\n    <div class=\"brand\">MY CARD<\/div>\n    <span class=\"field fv\" id=\"fNum\">1234 5678 9012 3456<\/span>\n    <div class=\"row\">\n      <span class=\"field\"><span class=\"fl\">유효기간<\/span><span class=\"fv\">12/29<\/span><\/span>\n      <span class=\"field\"><span class=\"fl\">CVC<\/span><span class=\"fv\">123<\/span><\/span>\n    <\/div>\n  <\/div>\n  <div class=\"abs merge\">▼ 세 정보를 하나로 합친 문자열<\/div>\n  <div class=\"abs\" id=\"keyBox\" data-hl=\"keyBox\" style=\"--c:var(--key)\">\n    <span class=\"pill\" id=\"keyPill\">API 키<\/span><span id=\"keyText\">sk-A7f3x9Q2…Lm8c<\/span>\n  <\/div>\n  <div class=\"abs note\">실물 없이 정보만 알면 사용 가능<\/div>\n\n  <!-- 경로 -->\n  <svg id=\"lanes\" width=\"760\" height=\"534\" viewBox=\"0 0 760 534\">\n    <path data-hl=\"laneReq\" d=\"M 384 132 L 546 132\" stroke=\"#d97706\"/>\n    <path data-hl=\"laneRes\" d=\"M 546 176 L 384 176\" stroke=\"#059669\"/>\n    <path data-hl=\"laneOther\" d=\"M 384 255 C 470 255, 470 150, 546 150\" stroke=\"#dc2626\"/>\n  <\/svg>\n\n  <!-- 내 웹앱 -->\n  <div class=\"abs box\" id=\"app\" data-hl=\"app\" style=\"--c:var(--app)\">\n    <div class=\"appT\">AI 번역기<\/div>\n    <div class=\"inp\">안녕하세요<\/div>\n    <div class=\"btnRow\"><span id=\"trBtn\">번역<\/span><span id=\"result\">Hello<\/span><\/div>\n  <\/div>\n  <div class=\"abs box\" id=\"other\" data-hl=\"other\" style=\"--c:var(--risk)\">\n    <div class=\"who\"><i>?<\/i>다른 사람<\/div>\n    <div id=\"otherMsg\">키를 모르면<br>요청 불가<\/div>\n  <\/div>\n\n  <!-- API 창구 -->\n  <div class=\"abs box\" id=\"gate\" data-hl=\"gate\" style=\"--c:var(--api)\">\n    <div class=\"gT\">요청 규칙<\/div>\n    <div class=\"rule\"><span class=\"fl\">주소<\/span><span class=\"v\">/v1/translate<\/span><\/div>\n    <div class=\"rule\"><span class=\"fl\">방식<\/span><span class=\"v\">POST<\/span><button class=\"info\" id=\"infoBtn\" aria-label=\"요청 방식 설명\">i<\/button><\/div>\n    <div class=\"rule\"><span class=\"fl\">인증<\/span><span class=\"v\">API 키 필수<\/span><\/div>\n    <div id=\"check\"><span class=\"fl\">키 확인<\/span><span id=\"checkV\">대기<\/span><\/div>\n  <\/div>\n\n  <!-- AI 서비스 -->\n  <div class=\"abs box\" id=\"server\" data-hl=\"server\" style=\"--c:var(--svc)\">\n    <div class=\"bh\"><div class=\"ico\">S<\/div><b>서버<\/b><\/div>\n    <div id=\"console\"><\/div>\n  <\/div>\n  <div class=\"abs box\" id=\"bill\" data-hl=\"bill\" style=\"--c:var(--svc)\">\n    <div class=\"bh\"><div class=\"ico\">₩<\/div><b>요금 청구<\/b><span style=\"margin-left:auto;font-size:12px;color:#4b5563;white-space:nowrap\">대상: 키 주인<\/span><\/div>\n    <div class=\"billRow\"><span>사용 요금<\/span><span id=\"amount\">₩0<\/span><\/div>\n    <div id=\"billMsg\"><\/div>\n  <\/div>\n\n  <div class=\"packet\" id=\"pReq\">요청 + API 키<\/div>\n  <div class=\"packet\" id=\"pRes\">결과: Hello<\/div>\n  <div class=\"packet\" id=\"pOther\">요청 + 내 API 키<\/div>\n\n  <!-- 하단 설명 -->\n  <div class=\"abs\" id=\"panel\">\n    <div id=\"stepper\"><\/div>\n    <div id=\"explain\">\n      <div class=\"head\"><span id=\"area\"><\/span><span id=\"stTitle\"><\/span><\/div>\n      <div id=\"stDesc\"><\/div>\n    <\/div>\n    <div id=\"code\"><\/div>\n  <\/div>\n\n  <div class=\"abs controls\">\n    <button id=\"bReset\">↺ 초기화<\/button>\n    <button id=\"bPrev\">◀ 이전<\/button>\n    <button id=\"bNext\">다음 ▶<\/button>\n    <button id=\"bPlay\" class=\"primary\">▶ 자동 재생<\/button>\n  <\/div>\n\n  <!-- 요청 방식 안내 팝업 -->\n  <div id=\"modal\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"mTitle\">\n    <div class=\"mbox\">\n      <div class=\"mhead\"><b id=\"mTitle\">HTTP 요청 방식<\/b><button class=\"mx\" id=\"mClose\" aria-label=\"닫기\">✕<\/button><\/div>\n      <div class=\"mdesc\">요청 방식은 서버에 <b>무엇을 하려는지<\/b> 알리는 표시입니다. 어떤 방식을 사용할지는 API를 만든 회사가 기능에 맞게 정합니다.<\/div>\n      <table class=\"mt\">\n        <tr><th>방식<\/th><th>의미<\/th><th>예시<\/th><\/tr>\n        <tr><td><span class=\"mth\" style=\"background:#2563eb\">GET<\/span><\/td><td>데이터 조회<\/td><td>날씨 정보, 게시물 목록 가져오기<\/td><\/tr>\n        <tr class=\"cur\"><td><span class=\"mth\" style=\"background:#d97706\">POST<\/span><\/td><td>데이터 전송, 작업 요청<\/td><td>번역, AI 답변 생성, 글 작성<\/td><\/tr>\n        <tr><td><span class=\"mth\" style=\"background:#7c3aed\">PUT<\/span><\/td><td>데이터 전체 수정<\/td><td>프로필 정보 전체 변경<\/td><\/tr>\n        <tr><td><span class=\"mth\" style=\"background:#0891b2\">PATCH<\/span><\/td><td>데이터 일부 수정<\/td><td>닉네임만 변경<\/td><\/tr>\n        <tr><td><span class=\"mth\" style=\"background:#dc2626\">DELETE<\/span><\/td><td>데이터 삭제<\/td><td>게시물 삭제<\/td><\/tr>\n      <\/table>\n      <div class=\"mnote\">이 예시의 번역 API는 입력 텍스트를 서버로 보내야 하므로 <b>POST<\/b>를 사용합니다. 제미나이, 클로드, GPT 같은 AI 서비스의 API도 대부분 POST를 사용합니다.<\/div>\n    <\/div>\n  <\/div>\n<\/div>\n\n<script>\nconst AREA = {\n  intro:{name:'안내',     color:'#1f2937'},\n  app:  {name:'클라이언트', color:'#2563eb'},\n  api:  {name:'API',      color:'#d97706'},\n  svc:  {name:'서버', color:'#059669'},\n  risk: {name:'보안',     color:'#dc2626'}\n};\n\nconst steps = [\n  { area:'intro', title:'API와 API 키',\n    desc:'API는 클라이언트와 서버가 기능을 요청하고 제공하는 정해진 창구입니다. API 키는 그 창구를 이용하는 사람을 확인하는 비밀 정보입니다.',\n    code:'// API 요청 = 규칙에 맞춘 주문서\\nPOST /v1/translate\\nAuthorization: Bearer sk-A7f3…\\n{ \"text\": \"안녕하세요\" }', hl:[] },\n  { area:'app', title:'요청 작성',\n    desc:'사용자가 [번역] 버튼을 누르면 클라이언트(내 웹앱)가 API 규칙에 맞춰 요청을 작성하고, 요청에 API 키를 첨부합니다.',\n    code:\"// API 키를 첨부하여 요청 작성\\nfetch(API_URL, {\\n  method: 'POST',\\n  headers: { Authorization: KEY },\\n  body: '{\\\"text\\\":\\\"안녕하세요\\\"}' });\", hl:['app','keyBox'] },\n  { area:'api', title:'요청 전송',\n    desc:'요청이 인터넷을 통해 서버의 API 창구로 전달됩니다. 정해진 주소와 형식을 지키지 않으면 처리되지 않습니다.',\n    code:'// 실제로 전송되는 HTTP 요청\\nPOST /v1/translate HTTP/1.1\\nHost: api.example.com\\nAuthorization: Bearer sk-A7f3…', hl:['laneReq','gate'], packet:'pReq' },\n  { area:'api', title:'키 확인',\n    desc:'서버는 API 키로 요청한 사람과 사용 권한을 확인합니다. 카드 결제 시 카드 번호, 유효기간, CVC를 확인하는 것과 같습니다.',\n    code:'// 서버 코드 (예시)\\nconst owner = findOwner(key);\\nif (!owner) return 401; // 거부\\n// 유효한 키 → 요청 처리', hl:['gate','keyBox','card'] },\n  { area:'svc', title:'실행·응답',\n    desc:'서버가 번역 기능을 실행하고 결과를 반환합니다. 클라이언트는 결과를 받아 화면에 표시합니다.',\n    code:'// 서버가 반환하는 응답\\nHTTP/1.1 200 OK\\n\\n{ \"result\": \"Hello\" }', hl:['server','laneRes','app'], packet:'pRes' },\n  { area:'svc', title:'요금 청구',\n    desc:'사용량만큼 요금이 API 키 주인의 계정에 청구됩니다. 카드 결제 대금이 카드 주인에게 청구되는 것과 같습니다.',\n    code:'// 키 주인의 계정에 사용량 기록\\nusage.add(owner, {\\n  requests: 1,\\n  cost: 50   // ₩50\\n});', hl:['bill','card'] },\n  { area:'risk', title:'키 유출',\n    desc:'다른 사람이 API 키를 알아내면 내 계정으로 요청할 수 있으며 요금은 나에게 청구됩니다. 카드 정보만으로 결제되는 것과 같습니다.',\n    code:'// 다른 사람의 요청 (같은 키 사용)\\nAuthorization: Bearer sk-A7f3…\\n// 키가 유효하므로 그대로 처리됨\\n// 요금은 키 주인에게 청구됨', hl:['other','laneOther','gate','bill'], packet:'pOther' },\n  { area:'risk', title:'안전한 관리',\n    desc:'API 키는 코드나 화면에 노출하지 않고 서버에 보관합니다. 유출이 의심되면 카드 분실 신고처럼 즉시 폐기하고 새 키를 발급받습니다.',\n    code:'// 키는 코드에 직접 입력하지 않음\\nconst KEY = process.env.API_KEY;\\n// 유출 시: 기존 키 폐기\\n// → 새 키 발급 후 교체', hl:['keyBox','card','other'] }\n];\nconst LAST = steps.length - 1;\n\nconst consoleText = [\n  '<span class=\"go\">●<\/span> 요청 대기 중…',\n  '<span class=\"go\">●<\/span> 요청 대기 중…',\n  '<span class=\"go\">●<\/span> 요청 대기 중…',\n  '<span class=\"go\">→<\/span> 요청 수신\\n<span class=\"ok\">✓<\/span> 키 확인: 나',\n  '<span class=\"ok\">✓<\/span> 키 확인: 나\\n<span class=\"go\">→<\/span> 번역 실행\\n<span class=\"go\">→<\/span> 결과 반환',\n  '<span class=\"ok\">✓<\/span> 처리 완료\\n<span class=\"go\">→<\/span> 사용량 기록: 1회',\n  '<span class=\"go\">→<\/span> 요청 수신 (출처 불명)\\n<span class=\"ok\">✓<\/span> 키 확인: 나\\n<span class=\"go\">→<\/span> 요청 처리',\n  '<span class=\"no\">✗<\/span> 폐기된 키 요청\\n<span class=\"no\">✗<\/span> 처리 거부 (401)'\n];\nconst checkText = ['대기','대기','대기','✓ 유효한 키','✓ 유효한 키','✓ 유효한 키','✓ 유효한 키','✗ 폐기된 키'];\nconst checkColor = ['#6b7280','#6b7280','#6b7280','#059669','#059669','#059669','#d97706','#dc2626'];\n\nconst $ = id => document.getElementById(id);\nlet cur = 0, timer = null;\n\nsteps.slice(1).forEach((s, i) => {\n  const el = document.createElement('div');\n  el.className = 'st';\n  el.style.setProperty('--c', AREA[s.area].color);\n  el.innerHTML = `<span class=\"n\">${i+1}<\/span>${s.title}`;\n  el.onclick = () => { stop(); go(i+1); };\n  $('stepper').appendChild(el);\n});\n\nfunction renderCode(text){\n  const box = $('code'); box.innerHTML = '';\n  text.split('\\n').forEach((line, i) => {\n    if (i) box.appendChild(document.createTextNode('\\n'));\n    const idx = line.indexOf('//');\n    if (idx < 0) { box.appendChild(document.createTextNode(line)); return; }\n    box.appendChild(document.createTextNode(line.slice(0, idx)));\n    const sp = document.createElement('span'); sp.className = 'cm'; sp.textContent = line.slice(idx);\n    box.appendChild(sp);\n  });\n}\n\nfunction go(n){\n  cur = Math.max(0, Math.min(LAST, n));\n  const s = steps[cur], a = AREA[s.area];\n\n  document.querySelectorAll('.st').forEach((el, i) => {\n    el.classList.toggle('cur', i+1 === cur);\n    el.classList.toggle('done', i+1 < cur);\n  });\n  $('area').textContent = cur ? `${cur}단계 · ${a.name}` : a.name;\n  $('area').style.background = a.color;\n  $('stTitle').textContent = s.title;\n  $('stDesc').textContent = s.desc;\n  renderCode(s.code);\n\n  document.querySelectorAll('[data-hl]').forEach(el => {\n    el.classList.toggle(el.tagName === 'path' ? 'on' : 'hl', s.hl.includes(el.dataset.hl));\n  });\n\n  /* 내 웹앱 */\n  $('trBtn').classList.toggle('press', cur === 1);\n  $('result').style.opacity = cur >= 4 ? 1 : 0;\n\n  /* 다른 사람 */\n  $('other').classList.toggle('show', cur >= 6);\n  $('otherMsg').innerHTML = cur < 6 ? '키를 모르면<br>요청 불가'\n    : cur === 6 ? '알아낸 내 키로<br>요청 전송' : '<b style=\"color:#dc2626\">✗ 요청 거부<\/b><br>폐기된 키';\n\n  /* 키 상태 */\n  const kt = $('keyText');\n  kt.textContent = cur === 7 ? 'sk-N4b8w1Kz…Wq1z' : 'sk-A7f3x9Q2…Lm8c';\n  $('keyPill').textContent = cur === 7 ? '새 키' : 'API 키';\n\n  /* 창구·서버 */\n  $('checkV').textContent = checkText[cur];\n  $('checkV').style.color = checkColor[cur];\n  $('console').innerHTML = consoleText[cur];\n\n  /* 요금 */\n  const amt = $('amount');\n  amt.textContent = cur < 5 ? '₩0' : cur === 5 ? '₩50' : '₩38,550';\n  amt.classList.toggle('warn', cur >= 6);\n  $('billMsg').innerHTML = cur === 6 ? '<span style=\"color:#dc2626\">⚠ 모르는 사용 내역 발생<\/span>'\n    : cur === 7 ? '<span style=\"color:#059669\">✓ 새 키로 교체 완료<\/span>' : '';\n\n  ['pReq','pRes','pOther'].forEach(id => {\n    const p = $(id); p.classList.remove('go');\n    if (s.packet === id) { void p.offsetWidth; p.classList.add('go'); }\n  });\n\n  $('bPrev').disabled = cur === 0;\n  $('bNext').disabled = cur === LAST;\n}\n\nfunction play(){\n  if (cur === LAST) go(0);\n  $('bPlay').textContent = '❚❚ 일시 정지';\n  go(cur + 1);\n  timer = setInterval(() => { if (cur < LAST) go(cur + 1); if (cur === LAST) stop(); }, 3000);\n}\nfunction stop(){\n  clearInterval(timer); timer = null;\n  $('bPlay').textContent = '▶ 자동 재생';\n}\n$('bPlay').onclick = () => timer ? stop() : play();\n$('bNext').onclick = () => { stop(); go(cur + 1); };\n$('bPrev').onclick = () => { stop(); go(cur - 1); };\n$('bReset').onclick = () => { stop(); go(0); };\n\n/* 요청 방식 안내 팝업 */\nconst modal = $('modal');\nfunction openModal(){ stop(); modal.classList.add('open'); }\nfunction closeModal(){ modal.classList.remove('open'); }\n$('infoBtn').onclick = openModal;\n$('mClose').onclick = closeModal;\nmodal.onclick = e => { if (e.target === modal) closeModal(); };\naddEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });\n\nfunction fit(){\n  const k = Math.min(innerWidth / 760, innerHeight / 584);\n  const st = $('stage');\n  st.style.transform = `scale(${k})`;\n  st.style.left = (innerWidth - 760 * k) / 2 + 'px';\n  st.style.top = (innerHeight - 584 * k) / 2 + 'px';\n}\naddEventListener('resize', fit);\nfit();\ngo(0);\n<\/script>\n<\/body>\n<\/html>\n"}, {"name": "호스팅", "html": "<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>정적 호스팅과 동적 호스팅<\/title>\n<style>\n  :root{\n    --ink:#1f2937; --muted:#6b7280; --line:#e5e7eb;\n    --st:#2563eb; --st-bg:#eff5ff;\n    --dy:#059669; --dy-bg:#ecfdf5;\n    --fn:#7c3aed;\n    --net:#d97706; --net-bg:#fffbeb;\n    --risk:#dc2626;\n    --mono:ui-monospace,Menlo,Consolas,monospace;\n  }\n  *{box-sizing:border-box;margin:0;padding:0}\n  html,body{width:100%;height:100%;overflow:hidden;background:#fff}\n  @media (prefers-color-scheme: dark){ html,body{background:#191919} }\n  body{font-family:\"Pretendard\",\"Apple SD Gothic Neo\",\"Malgun Gothic\",\"Noto Sans KR\",system-ui,sans-serif;color:var(--ink)}\n  #stage{position:absolute;left:0;top:0;width:760px;height:584px;transform-origin:0 0;background:#fff;border-radius:18px;overflow:hidden}\n  .abs{position:absolute}\n\n  .title{left:14px;top:12px;font-size:20px;font-weight:800;letter-spacing:-.6px}\n  .controls{left:0;right:0;top:542px;display:flex;justify-content:center;gap:8px}\n  .controls button{font:inherit;font-size:14px;font-weight:700;padding:7px 16px;border-radius:7px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}\n  .controls button:hover:not(:disabled){background:#f3f4f6}\n  .controls button:disabled{opacity:.35;cursor:default}\n  .controls .primary{background:var(--ink);color:#fff;border-color:var(--ink)}\n  .controls .primary:hover{background:#374151 !important}\n\n  /* 영역 */\n  .zone{top:52px;height:254px;border-radius:12px;padding:7px 10px}\n  .zone h3{font-size:15px;font-weight:800;letter-spacing:-.3px;line-height:1.25}\n  .zone h3 span{font-size:12px;font-weight:700;opacity:.75;margin-left:4px}\n  .zone p{font-size:12px;color:#4b5563;margin-top:1px;white-space:nowrap}\n  #zUser{left:12px;width:232px;background:var(--st-bg)} #zUser h3{color:var(--st)}\n  #zNet{left:250px;width:88px;background:var(--net-bg);text-align:center;padding:7px 4px} #zNet h3{color:var(--net)}\n  #zSrv{left:344px;width:404px;background:#f3f4f6;transition:background .4s}\n  #zSrv h3{color:#374151}\n  #mode{position:absolute;right:10px;top:8px;font-size:12px;font-weight:800;color:#fff;border-radius:5px;padding:2px 8px;line-height:16px;transition:background .3s}\n  #modeEx{position:absolute;right:10px;top:30px;font-size:12px;color:#4b5563}\n\n  /* 브라우저 */\n  .win{left:22px;width:212px;background:#fff;border:1px solid #cbd5e1;border-radius:9px;overflow:hidden;transition:box-shadow .3s}\n  #wA{top:98px;height:98px}\n  #wB{top:206px;height:92px;position:absolute}\n  .bar{height:22px;background:#e8ecf2;display:flex;align-items:center;gap:6px;padding:0 7px;font-size:12px;color:#475569}\n  .bar i{width:7px;height:7px;border-radius:50%;display:block}\n  .bar b{font-weight:800;color:#334155}\n  .bar span{margin-left:auto;font-size:11.5px}\n  .page{padding:7px 9px;font-size:13px;line-height:1.45;position:relative}\n  .pt{font-size:13.5px;font-weight:800;display:block}\n  .pd{color:#374151}\n  .ph{color:#9ca3af;font-size:13px;padding-top:12px;text-align:center}\n  .ai{margin-top:3px;font-size:12px;font-weight:700;color:var(--fn);background:#f5f3ff;border-radius:5px;padding:1px 6px;display:inline-block}\n  .src{font-size:12px;color:var(--risk);font-weight:700}\n  .src code{display:block;margin-top:3px;font-family:var(--mono);font-size:12px;background:#fef2f2;border:1px solid #fecaca;border-radius:5px;padding:2px 6px;color:#991b1b}\n  #cmp{position:absolute;right:7px;bottom:6px;font-size:12px;font-weight:800;color:#fff;border-radius:4px;padding:0 6px;line-height:18px;opacity:0;transition:opacity .3s}\n\n  /* 서버 내부 */\n  .box{position:absolute;background:#fff;border:1px solid #d1d5db;border-radius:9px;padding:8px;transition:box-shadow .3s,opacity .3s,border-color .3s}\n  #files{left:354px;top:98px;width:180px;height:200px}\n  #exec{left:542px;top:98px;width:196px;height:110px}\n  #db{left:542px;top:216px;width:196px;height:82px}\n  .bh{display:flex;align-items:center;gap:6px;height:22px}\n  .ico{width:22px;height:22px;border-radius:6px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex:none;background:#6b7280}\n  .bh b{font-size:14px;font-weight:800;white-space:nowrap}\n  .fl{list-style:none;margin-top:7px;display:flex;flex-direction:column;gap:5px}\n  .fl li{font-family:var(--mono);font-size:12.5px;font-weight:700;border:1px solid var(--line);border-radius:6px;padding:4px 7px;display:flex;justify-content:space-between;align-items:center;transition:background .4s,border-color .3s,opacity .4s}\n  .fl li em{font-style:normal;font-family:inherit;font-size:11.5px;font-weight:600;color:var(--muted)}\n  .fl li.flash{background:#fef9c3}\n  .fl li.warn{border-color:#fca5a5;background:#fef2f2}\n  .fl li.warn em{color:var(--risk);font-weight:800}\n  .fl.empty li{opacity:.2}\n  #fileNote{margin-top:8px;font-size:12px;color:#4b5563;line-height:1.4}\n  #console{margin-top:6px;height:64px;background:#0f172a;border-radius:6px;padding:4px 8px;font-family:var(--mono);font-size:12px;line-height:1.4;color:#cbd5e1;white-space:pre;overflow:hidden}\n  #console .ok{color:#4ade80} #console .go{color:#fbbf24} #console .no{color:#f87171}\n  table{margin-top:5px;width:100%;border-collapse:collapse;font-size:12.5px}\n  td{border:1px solid #e5e7eb;padding:2px 7px;height:21px}\n  td.num{font-family:var(--mono);font-weight:800;text-align:right}\n  .off{opacity:.38}\n  .offTag{position:absolute;right:8px;top:9px;font-size:12px;font-weight:800;color:var(--risk);display:none}\n  .off .offTag{display:block}\n  .off #console{visibility:hidden}\n\n  .hl{box-shadow:0 0 0 3px var(--c),0 5px 14px rgba(0,0,0,.12) !important;opacity:1 !important}\n\n  /* 경로 */\n  #lanes{position:absolute;left:0;top:0;pointer-events:none}\n  #lanes path{fill:none;stroke-width:2.5;stroke-dasharray:5 5;opacity:.35;transition:opacity .3s,stroke-width .3s}\n  #lanes path.on{opacity:1;stroke-width:3.5;animation:dash .6s linear infinite}\n  @keyframes dash{to{stroke-dashoffset:-10}}\n  .packet{position:absolute;left:0;top:0;offset-anchor:50% 50%;offset-rotate:0deg;font-size:12px;font-weight:800;color:#fff;padding:3px 8px;border-radius:12px;white-space:nowrap;opacity:0;pointer-events:none;box-shadow:0 3px 8px rgba(0,0,0,.2);z-index:5}\n  .packet.go{opacity:1;animation:travel 1.6s ease-in-out forwards}\n  @keyframes travel{from{offset-distance:0%}to{offset-distance:100%}}\n  #pReqA{background:var(--net);offset-path:path('M 234 134 L 354 134')}\n  #pReqB{background:var(--net);offset-path:path('M 234 238 L 354 238')}\n  #pResA{background:var(--st);offset-path:path('M 354 160 L 234 160')}\n  #pResB{background:var(--st);offset-path:path('M 354 264 L 234 264')}\n  #pFn{background:var(--fn);offset-path:path('M 234 128 L 542 128')}\n  #pFnRes{background:var(--fn);offset-path:path('M 542 176 L 234 176')}\n  #pFnRes.go{animation:travelLate 3.2s ease-in-out forwards}\n  @keyframes travelLate{0%,50%{offset-distance:0%;opacity:0}52%{opacity:1}100%{offset-distance:100%;opacity:1}}\n\n  /* 하단 설명 */\n  #panel{left:12px;top:314px;width:736px;height:218px;border:1px solid var(--line);border-radius ild(document.createTextNode(line.slice(0, idx)));\n    const sp = document.createElement('span'); sp.className = 'cm'; sp.textContent = line.slice(idx);\n    box.appendChild(sp);\n  });\n}\n\nfunction go(n){\n  cur = Math.max(0, Math.min(LAST, n));\n  const s = steps[cur], a = AREA[s.area], m = MODE[s.mode];\n\n  document.querySelectorAll('.st').forEach((el, i) => {\n    el.classList.toggle('cur', i+1 === cur);\n    el.classList.toggle('done', i+1 < cur);\n  });\n  $('area').textContent = cur ? `${cur}단계 · ${a.name}` : a.name;\n  $('area').style.background = a.color;\n  $('stTitle').textContent = s.title;\n  $('stDesc').textContent = s.desc;\n  renderCode(s.code);\n\n  /* 호스팅 방식 표시 */\n  $('mode').textContent = m.label;\n  $('mode').style.background = m.color;\n  $('modeEx').textContent = m.ex;\n  $('zSrv').style.background = m.bg;\n\n  /* 브라우저 화면 */\n  $('pageA').innerHTML = s.A;\n  $('pageB').innerHTML = s.B;\n  const c = $('cmp');\n  c.style.opacity = s.cmp ? 1 : 0;\n  c.textContent = s.cmp === 'same' ? 'A와 같은 화면' : s.cmp === 'diff' ? 'A와 다른 화면' : s.cmp === 'base' ? '기본 화면은 A와 같음' : '';\n  c.style.background = s.cmp === 'diff' ? '#059669' : '#2563eb';\n\n  /* 파일 */\n  $('fl').classList.toggle('empty', !s.files);\n  ['f1','f2','f3'].forEach(id => $(id).classList.toggle('flash', !!s.flash));\n  $('f3').classList.toggle('warn', !!s.warn);\n  $('f3t').textContent = s.warn ? '비밀 정보 노출' : '동작';\n  $('fileNote').textContent = s.mode === 'st' ? '요청이 오면 이 파일을 그대로 전달함'\n    : s.mode === 'dy' ? '화면 틀만 보관하고, 내용은 서버가 생성함'\n    : s.mode === 'fn' ? '화면은 이 파일을 그대로 전달함' : '';\n\n  /* 코드 실행·데이터 저장 */\n  const staticMode = s.mode === 'st';\n  $('exec').classList.toggle('off', staticMode);\n  $('db').classList.toggle('off', staticMode || s.mode === 'fn');\n  $('dbOff').textContent = s.mode === 'fn' ? '필요 시 외부 연동' : '✗ 기능 없음';\n  $('dbOff').style.display = s.mode === 'fn' ? 'none' : '';\n  $('execT').textContent = s.mode === 'fn' ? '서버 함수' : '코드 실행';\n  $('execIco').style.background = s.mode === 'fn' ? '#7c3aed' : s.mode === 'dy' ? '#059669' : '#6b7280';\n  $('dbIco').style.background = s.mode === 'dy' ? '#059669' : '#6b7280';\n  $('console').innerHTML = s.mode === 'st' ? '' : s.mode === 'fn' ? (cur === 6 ? consoleText.fn : consoleText.fnIdle) : consoleText[s.mode];\n\n  /* 강조 */\n  document.querySelectorAll('[data-hl]').forEach(el => {\n    const on = s.hl.includes(el.dataset.hl);\n    if (el.tagName === 'path') { el.classList.toggle('on', on); return; }\n    el.classList.toggle('hl', on);\n    el.style.setProperty('--c', s.hlColor || (el.id === 'exec' && s.mode === 'fn' ? '#7c3aed' : el.id === 'files' || el.id.startsWith('w') ? '#2563eb' : '#059669'));\n  });\n  if (cur === 5) document.querySelectorAll('#wA,#wB').forEach(el => el.style.setProperty('--c', '#059669'));\n  if (cur === 6) $('wA').style.setProperty('--c', '#7c3aed');\n\n  /* 이동 표시 */\n  ['pResA','pResB'].forEach(id => { $(id).textContent = s.resLabel || '파일'; $(id).style.background = s.resLabel ? '#059669' : '#2563eb'; });\n  ['pReqA','pReqB','pResA','pResB','pFn','pFnRes'].forEach(id => {\n    const p = $(id); p.classList.remove('go');\n    if ((s.packets || []).includes(id)) { void p.offsetWidth; p.classList.add('go'); }\n  });\n\n  $('bPrev').disabled = cur === 0;\n  $('bNext').disabled = cur === LAST;\n}\n\nfunction play(){\n  if (cur === LAST) go(0);\n  $('bPlay').textContent = '❚❚ 일시 정지';\n  go(cur + 1);\n  timer = setInterval(() => { if (cur < LAST) go(cur + 1); if (cur === LAST) stop(); }, 3200);\n}\nfunction stop(){\n  clearInterval(timer); timer = null;\n  $('bPlay').textContent = '▶ 자동 재생';\n}\n$('bPlay').onclick = () => timer ? stop() : play();\n$('bNext').onclick = () => { stop(); go(cur + 1); };\n$('bPrev').onclick = () => { stop(); go(cur - 1); };\n$('bReset').onclick = () => { stop(); go(0); };\n\nfunction fit(){\n  const k = Math.min(innerWidth / 760, innerHeight / 584);\n  const st = $('stage');\n  st.style.transform = `scale(${k})`;\n  st.style.left = (innerWidth - 760 * k) / 2 + 'px';\n  st.style.top = (innerHeight - 584 * k) / 2 + 'px';\n}\naddEventListener('resize', fit);\nfit();\ngo(0);\n<\/script>\n<\/body>\n<\/html>\n"}];
const tabs = document.getElementById('tabs'), view = document.getElementById('view'), card = document.getElementById('card');
const frames = PAGES.map((p, i) => {
  const b = document.createElement('button');
  b.textContent = p.name; b.setAttribute('role','tab');
  b.onclick = () => show(i);
  tabs.appendChild(b);
  const f = document.createElement('iframe');
  f.title = p.name; f.srcdoc = p.html;
  view.appendChild(f);
  return {b, f};
});
let cur = -1;
function show(i){
  if (i === cur) return;
  if (cur >= 0) { try { const w = frames[cur].f.contentWindow; if (w.stop) w.stop(); } catch(e){} }
  frames.forEach((x, j) => {
    x.b.classList.toggle('on', j === i);
    x.b.setAttribute('aria-selected', j === i);
    x.f.classList.toggle('on', j === i);
  });
  cur = i;
  const w = frames[i].f.contentWindow;
  requestAnimationFrame(() => { try { w.dispatchEvent(new Event('resize')); } catch(e){} });
}
frames.forEach(x => x.f.addEventListener('load', () => { try { x.f.contentWindow.dispatchEvent(new Event('resize')); } catch(e){} }));
function fit(){
  const k = Math.min(innerWidth / 760, innerHeight / 620);
  card.style.transform = `scale(${k})`;
  card.style.left = (innerWidth - 760 * k) / 2 + 'px';
  card.style.top = (innerHeight - 620 * k) / 2 + 'px';
}
addEventListener('resize', fit);
fit();
show(0);
